name: Publish Foundry Module
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: combat-chronicle-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine version
        shell: bash
        run: |
          VERSION="$(node -p 'require("./module.json").version')"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag and manifest versions do not match" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Test and syntax-check
        run: |
          node --test tests/*.test.mjs
          find scripts tools -name '*.mjs' -exec node --check '{}' \;
      - name: Generate release manifest
        run: node tools/prepare-release.mjs --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Package installable ZIP
        run: |
          (cd dist/stage && zip -qr ../combat-chronicle.zip .)
          unzip -t dist/combat-chronicle.zip
          unzip -p dist/combat-chronicle.zip module.json | cmp - dist/module.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Release tag already belongs to another commit" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/module.json dist/combat-chronicle.zip --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" dist/module.json dist/combat-chronicle.zip \
              --target "$GITHUB_SHA" \
              --title "Combat Chronicle $RELEASE_TAG" \
              --notes "Experimental module for Foundry VTT 13.351 and PF1e 11.11. Test in a cloned world." \
              --latest
          fi
